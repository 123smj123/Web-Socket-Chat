<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Socket Chat</title>

    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="image/favicon.png">

    <script type="module" src="script/client.js"></script>

</head>

<body>
    <h1 id="pageTitle">Online Chat</h1>

    <div id="layout">
        <section id="otherChats">
            <hr>
            <button id="deleteChat">Delete chat</button>
            <button id="newUsername">New username</button>
        </section>

        <section id="chat">
            <ul id="messages">
                <p id="chatTitle">Nuevo Chat</p>
            </ul>
            <form id="form">
                <input type="text" name="message" id="input" placeholder="Type a new message" autocomplete="off" />
                <button type="submit">Send</button>
            </form>
        </section>
    </div>
</body>
